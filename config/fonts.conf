<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Project-local fontconfig: system defaults + bundled fonts in assets/fonts. -->
<fontconfig>
  <include ignore_missing="yes">/opt/homebrew/etc/fonts/fonts.conf</include>
  <dir prefix="relative">../assets/fonts</dir>
  <cachedir prefix="relative">../data/.fontcache</cachedir>
  <!-- Pango mis-parses family names containing sizes ("72pt"), so expose simple aliases. -->
  <alias binding="strong"><family>Reel Display</family><prefer><family>Fraunces 72pt Soft</family></prefer></alias>
  <alias binding="strong"><family>Reel Text</family><prefer><family>Fraunces 9pt Soft</family></prefer></alias>
</fontconfig>
